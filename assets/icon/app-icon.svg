<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1B3A"/>
      <stop offset="55%" stop-color="#123E6B"/>
      <stop offset="100%" stop-color="#0A2A4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#35D0E0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#35D0E0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- 隧道：外拱 -->
  <path d="M212 760 A300 300 0 0 1 812 760" fill="none"
        stroke="#FFFFFF" stroke-width="76" stroke-linecap="round"/>
  <!-- 隧道：内拱（纵深） -->
  <path d="M332 760 A180 180 0 0 1 692 760" fill="none"
        stroke="#35D0E0" stroke-width="52" stroke-linecap="round"/>
  <!-- 地基 -->
  <rect x="212" y="760" width="600" height="76" rx="38" fill="#FFFFFF"/>
  <!-- 出口信号点 -->
  <circle cx="512" cy="392" r="34" fill="#35D0E0"/>
</svg>
